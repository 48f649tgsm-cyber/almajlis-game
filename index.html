<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>المجلس</title>
<style>
:root{--gold:#b9862d;--text:#111;--muted:#6f7780;--red:#a12630;--blue:#245da8;--line:#e3e6e9}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}button,input{font:inherit}
.app{max-width:760px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block}
.brand{text-align:center;padding:45px 0 25px}.brand .mark{font-size:68px}.brand h1{font-size:60px;margin:4px;color:var(--gold)}.brand p{color:#555}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #0000000d}
.btn{width:100%;border:1px solid #d2d6db;border-radius:13px;padding:15px;margin:7px 0;background:#fff;color:#111;font-weight:800}.btn.gold{background:linear-gradient(#f4d693,#d5a345);color:#16110a;border:0}.btn.red{background:#fff3f4;border-color:#e5b5ba}.btn.blue{background:#f2f7ff;border-color:#b7cae6}
h2{text-align:center}label{display:block;color:#8b651f;margin:14px 3px 6px}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #ccd1d7;background:#fff;color:#111}.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{min-height:88px;padding:10px;border:1px solid #d8dce1;border-radius:14px;background:#fff;color:#111;display:flex;align-items:center;gap:10px;text-align:right}.cat.sel{border:2px solid var(--gold);background:#fff8ea}.catIcon{width:62px;height:62px;border-radius:14px;background:#f7f3e9;display:grid;place-items:center;font-size:30px;flex:0 0 62px;overflow:hidden;border:1px solid #eadfc8}.catIcon img{width:100%;height:100%;object-fit:contain;padding:6px}.catName{font-weight:800;line-height:1.25}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}.teamScore{border-radius:12px;padding:10px;text-align:center;font-weight:900}.teamScore.red{background:#fff0f1;border:1px solid #e6b0b5}.teamScore.blue{background:#eef5ff;border:1px solid #b7cae5}.logo{text-align:center;color:var(--gold);font-size:22px;font-weight:900}.board{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.categoryBox{border:1px solid #ddd2bc;border-radius:14px;padding:8px;background:#fff}.categoryHead{display:flex;align-items:center;gap:7px;justify-content:center;min-height:45px}.categoryHead .mini{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#f7f3e9;font-size:20px}.categoryBox h3{text-align:center;font-size:14px;margin:4px}.points{display:grid;grid-template-columns:1fr 1fr;gap:5px}.point{padding:10px 3px;border:1px solid #d2bd94;border-radius:8px;background:#fffaf0;color:#8c6218;font-weight:900}.point.used{opacity:.28;text-decoration:line-through}.question{font-size:25px;line-height:1.7;text-align:center;padding:24px 8px;color:#111;font-weight:750}.timer{width:126px;height:126px;border:8px solid #c84047;border-radius:50%;display:grid;place-items:center;margin:20px auto;font-size:30px;font-weight:900}.timer.steal{border-color:#3477c8}.answer{text-align:center;font-size:28px;color:#7e5715;font-weight:900;padding:18px}.hidden{display:none}.small{color:var(--muted);text-align:center}.winner{text-align:center;padding:35px 0}.trophy{font-size:76px}.winnerName{font-size:34px;color:var(--gold);font-weight:900}.topline{display:flex;justify-content:space-between;align-items:center}.badge{color:#8a631e;font-weight:900}.note{font-size:12px;color:#777;text-align:center;margin-top:12px}.error{background:#fff2f2;color:#8b2020;border:1px solid #e4b4b4;border-radius:12px;padding:12px;margin:12px 0;text-align:center}.winnerImageWrap{position:relative;max-width:640px;margin:0 auto 18px}.winnerImageWrap img{width:100%;display:block;border-radius:22px}.winnerOverlay{position:absolute;top:5.2%;left:50%;transform:translateX(-50%);width:78%;text-align:center;color:#f2c35d;font-size:clamp(26px,6vw,48px);font-weight:900;text-shadow:0 2px 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:620px){.categories{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(3,1fr)}}
</style>
<style>
.catIcon img{width:100%;height:100%;object-fit:contain;display:block}
.locked-clasico{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;border-radius:12px;padding:3px;box-sizing:border-box}
.locked-clasico img{width:48%;height:92%;object-fit:contain}
</style>
</head>
<body><main class="app">
<section id="home" class="screen active"><div class="brand"><div class="mark">🏮</div><h1>المجلس</h1><p>مسابقة المعرفة</p></div><div id="loadStatus" class="card small">جاري تحميل بنك الأسئلة...</div><button id="newGameBtn" class="btn gold" disabled onclick="show('teams')">⚔️ ابدأ مجلس جديد</button></section>
<section id="teams" class="screen"><h2>أسماء الفريقين</h2><div class="card"><label>الفريق الأول</label><input id="t1" class="input" placeholder="الفريق الأول"><label>الفريق الثاني</label><input id="t2" class="input" placeholder="الفريق الثاني"></div><button class="btn gold" onclick="toCategories()">التالي</button></section>
<section id="cats" class="screen"><div class="topline"><h2>اختيار الفئات</h2><span id="cc" class="badge">0 / 6</span></div><p class="small">اختر 6 فئات</p><div id="catGrid" class="categories"></div><button id="startBtn" class="btn gold" disabled onclick="draw()">ابدأ اللعبة</button></section>
<section id="draw" class="screen"><h2>القرعة</h2><div class="card winner"><div class="trophy">🎲</div><p>الفريق الذي يبدأ هو</p><div id="starter" class="winnerName"></div></div><button class="btn gold" onclick="startGame()">ابدأ المباراة</button></section>
<section id="boardScreen" class="screen"><div class="logo">المجلس</div><div id="boardTurn" class="card" style="text-align:center;font-size:20px;font-weight:900;border:2px solid var(--gold);padding:12px"></div><div class="scorebar"><div id="s2" class="teamScore red"></div><div>⚔️</div><div id="s1" class="teamScore blue"></div></div><div id="board" class="board"></div></section>
<section id="questionScreen" class="screen"><div class="topline"><span id="qCat" class="badge"></span><span id="qPts" class="badge"></span></div><div id="qText" class="question"></div><div id="qMedia"></div><div id="timer" class="timer">00:30</div><p id="turnText" class="small"></p><button id="answerBtn" class="btn" onclick="reveal()">👁 إظهار الجواب</button><div id="answerArea" class="hidden"><div class="small">الإجابة الصحيحة</div><div id="answer" class="answer"></div><p class="small">من حصل على النقاط؟</p><button id="give1" class="btn blue" onclick="award(1)"></button><button id="give2" class="btn red" onclick="award(2)"></button><button class="btn" onclick="award(0)">لا أحد</button></div></section>
<section id="result" class="screen"><div class="winner"><div class="winnerImageWrap"><img src="winner_celebration.png" alt="تتويج الفريق الفائز"><div id="winnerName" class="winnerOverlay"></div></div><div id="finalScores" class="card"></div></div><button class="btn gold" onclick="location.reload()">مجلس جديد</button><div class="note">الأسئلة المستخدمة تحفظ على هذا الجهاز لمنع تكرارها.</div></section>
</main>

  return `<img src="${src}" alt="${c}" loading="eager" referrerpolicy="no-referrer">`;
}


let bank={},categories=[],selected=[],team1='',team2='',score1=0,score2=0,current=null,timerId=null,time=30,steal=false,usedCount=0,gameQuestions={},currentTurn=1;
let gameEntities={players:new Set(),clubs:new Set(),countries:new Set(),matches:new Set()};
const usedKey='almajlis_used_questions_v48';let usedIds=new Set(JSON.parse(localStorage.getItem(usedKey)||'[]'));

function mergeCategories(target,source){for(const [cat,items] of Object.entries(source||{})){if(!target[cat])target[cat]=[];const ids=new Set(target[cat].map(q=>q.id));for(const q of items||[]){if(q&&q.id&&!ids.has(q.id)){target[cat].push(q);ids.add(q.id)}}}}
async function fetchJson(path,required=true){const r=await fetch(path,{cache:'no-store'});if(!r.ok){if(required)throw new Error(path+' HTTP '+r.status);return null}return r.json()}

function decodeMimePayload(){
  try{
    const token=new URLSearchParams(location.search).get('mime');
    if(!token)return null;
    return JSON.parse(decodeURIComponent(escape(atob(token))));
  }catch(e){return null}
}
function showMimeRevealFromUrl(){
  const obj=decodeMimePayload();
  if(!obj)return false;
  document.querySelector('main.app').innerHTML=`
    <section class="screen active">
      <div class="card winner" style="margin-top:12vh">
        <div style="font-size:66px">🤫</div>
        <h2>من غير كلام</h2>
        <div class="small">نوع العمل</div>
        <div class="answer">${obj.t}</div>
        <div class="small">اسم العمل المطلوب تمثيله</div>
        <div class="winnerName">${obj.n}</div>
        <p class="small" style="margin-top:22px">احفظ الاسم ثم أغلق هذه الصفحة. ممنوع الكلام أو إظهار الشاشة للفريق.</p>
      </div>
    </section>`;
  return true;
}
function mimeRevealUrl(q){
  const payload=btoa(unescape(encodeURIComponent(JSON.stringify({t:q.mime.type,n:q.mime.title}))));
  return location.origin+location.pathname+'?mime='+encodeURIComponent(payload);
}
function renderMimeQR(q){
  const url=mimeRevealUrl(q);
  const qr='https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=10&data='+encodeURIComponent(url);
  return `<div style="text-align:center;margin:10px auto 18px">
    <div style="font-weight:900;margin-bottom:9px">عضو واحد من الفريق يصوّر الباركود</div>
    <img src="${qr}" alt="باركود السؤال" style="width:220px;height:220px;border:1px solid #ddd;border-radius:14px;background:white">
    <div class="note">الرابط يعرض اسم العمل لذلك لا تفتح الصفحة أمام بقية الفريق.</div>
  </div>`;
}

async function loadBank(){
  if(showMimeRevealFromUrl())return;
  try{
    const base=await fetchJson('./questions_v4_8_READY.json');
    bank={};
    mergeCategories(bank,base.categories);
    const batches=['./questions_v6_batch_001.json','./questions_v6_batch_002.json','./questions_v6_batch_003.json','./questions_v6_batch_004.json','./questions_v6_batch_005.json','./questions_v6_batch_006.json'];
    let loadedBatches=0;
    for(const path of batches){
      try{
        const data=await fetchJson(path,false);
        if(data&&data.categories){mergeCategories(bank,data.categories);loadedBatches++}
      }catch(e){console.warn('تعذر تحميل',path,e)}
    }
    categories=Object.keys(bank);
    const total=categories.reduce((n,c)=>n+bank[c].length,0);
    loadStatus.textContent=`تم تحميل ${categories.length} فئة و ${total} سؤال${loadedBatches?' (مع الدفعات الجديدة)':''}`;
    newGameBtn.disabled=false;
  }catch(e){
    loadStatus.className='error';
    loadStatus.textContent='تعذر تحميل بنك الأسئلة. تأكد من وجود ملفات JSON بجانب index.html.';
    console.error(e)
  }
}
loadBank();

function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function toCategories(){team1=t1.value.trim()||'الفريق الأول';team2=t2.value.trim()||'الفريق الثاني';renderCats();show('cats')}
function remainingByLevel(cat,pts){return (bank[cat]||[]).filter(q=>q.points===pts&&!usedIds.has(q.id)).length}
function categoryPlayable(cat){return [100,300,500].every(p=>remainingByLevel(cat,p)>=2)}
function categoryRemainingTotal(cat){return [100,300,500].reduce((n,p)=>n+remainingByLevel(cat,p),0)}
function renderCats(){catGrid.innerHTML='';categories.forEach(c=>{const b=document.createElement('button');const playable=categoryPlayable(c);b.className='cat'+(selected.includes(c)?' sel':'');
b.disabled=!playable;
b.style.opacity=playable?'1':'.38';
const remain=categoryRemainingTotal(c);
b.innerHTML=`<span class="catIcon">${categoryVisual(c)}</span><span class="catName">${c}${playable?'':`<br><small style="color:#a12630">مستنفدة مؤقتًا</small>`}</span>`;
b.title=playable?`متبقي ${remain} سؤالًا غير مستخدم`:'لا يتبقى سؤالان على الأقل في كل مستوى 100/300/500';
b.onclick=()=>{if(!playable)return;if(selected.includes(c))selected=selected.filter(x=>x!==c);else if(selected.length<6)selected.push(c);renderCats()};catGrid.appendChild(b)});cc.textContent=selected.length+' / 6';startBtn.disabled=selected.length!==6}
function draw(){currentTurn=Math.random()<.5?1:2;starter.textContent=currentTurn===1?team1:team2;show('draw')}
function conflicts(q){const e=q.entities||{};return Object.keys(gameEntities).some(k=>(e[k]||[]).some(v=>gameEntities[k].has(v)))}
function rememberEntities(q){const e=q.entities||{};Object.keys(gameEntities).forEach(k=>(e[k]||[]).forEach(v=>gameEntities[k].add(v)))}
function buildGameQuestions(){gameQuestions={};gameEntities={players:new Set(),clubs:new Set(),countries:new Set(),matches:new Set()};for(const cat of selected){gameQuestions[cat]={100:[],300:[],500:[]};for(const pts of [100,300,500]){let pool=(bank[cat]||[]).filter(q=>q.points===pts&&!usedIds.has(q.id));pool=[...pool].sort(()=>Math.random()-.5);const chosen=[];for(const q of pool){if(chosen.length>=2)break;if(!conflicts(q)){chosen.push(q);rememberEntities(q)}}if(chosen.length<2){for(const q of pool){if(chosen.length>=2)break;if(!chosen.includes(q)){chosen.push(q);rememberEntities(q)}}}if(chosen.length<2){alert(`الفئة "${cat}" لا تحتوي سؤالين مناسبين من مستوى ${pts}.`);return false}gameQuestions[cat][pts]=chosen}}return true}
function startGame(){if(!buildGameQuestions())return;renderBoard();updateScores();updateTurnBanner();show('boardScreen')}
function updateTurnBanner(){boardTurn.textContent='الدور الآن: '+(currentTurn===1?team1:team2)+' — اختر الفئة والسؤال'}
function renderBoard(){board.innerHTML='';selected.forEach(c=>{const box=document.createElement('div');box.className='categoryBox';box.innerHTML=`<div class="categoryHead"><span class="mini">${categoryVisual(c)}</span><h3>${c}</h3></div><div class="points"></div>`;const p=box.querySelector('.points');for(const pts of [100,100,300,300,500,500]){const b=document.createElement('button');b.className='point';b.textContent=pts;b.dataset.used='0';b.onclick=()=>openQuestion(c,pts,b);p.appendChild(b)}board.appendChild(box)})}
function renderQuestionMedia(q){const m=q.media;if(!m)return '';if(m.type==='image')return `<div style="max-width:430px;margin:0 auto 18px"><img src="${m.src}" alt="${m.alt||''}" style="width:100%;max-height:260px;object-fit:contain;border-radius:16px;border:1px solid #ddd"></div>`;if(m.type==='lineup'){const cells=[...(m.players||[]),'؟'].map(n=>`<div style="background:#ffffffdd;border:1px solid #d6e3d4;border-radius:9px;padding:7px 3px;font-size:11px;font-weight:800;text-align:center">${n}</div>`).join('');return `<div style="max-width:460px;margin:0 auto 18px;background:#3c9b55;padding:14px;border-radius:18px"><div style="color:white;text-align:center;font-weight:900;margin-bottom:8px">التشكيلة • ${m.formation||''}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">${cells}</div></div>`}return ''}
function openQuestion(cat,pts,btn){if(btn.dataset.used==='1')return;const arr=gameQuestions[cat][pts],q=arr.shift();if(!q){alert('لا يوجد سؤال متبقٍ لهذا المستوى.');return}current={cat,pts,btn,q};qCat.textContent=cat;qPts.textContent=pts+' نقطة';qText.innerHTML=q.question_html||q.question;answer.textContent=q.answer;qMedia.innerHTML=(cat==='من غير كلام'&&q.mime)?renderMimeQR(q):renderQuestionMedia(q);answerArea.classList.add('hidden');answerBtn.classList.remove('hidden');steal=false;time=(cat==='من غير كلام'?60:30);timer.classList.remove('steal');turnText.textContent='دور '+(currentTurn===1?team1:team2);show('questionScreen');runTimer()}
function runTimer(){clearInterval(timerId);paintTimer();timerId=setInterval(()=>{time--;paintTimer();if(time<=0){clearInterval(timerId);if(!steal){steal=true;time=15;timer.classList.add('steal');turnText.textContent='انتقل السؤال إلى '+(currentTurn===1?team2:team1);runTimer()}else reveal()}},1000)}
function paintTimer(){timer.textContent='00:'+String(time).padStart(2,'0')}
function reveal(){clearInterval(timerId);answerArea.classList.remove('hidden');answerBtn.classList.add('hidden');give1.textContent=team1+' +'+current.pts;give2.textContent=team2+' +'+current.pts}
function award(n){if(n===1)score1+=current.pts;if(n===2)score2+=current.pts;usedIds.add(current.q.id);localStorage.setItem(usedKey,JSON.stringify([...usedIds]));current.btn.dataset.used='1';current.btn.classList.add('used');current.btn.textContent='✓';usedCount++;currentTurn=currentTurn===1?2:1;updateScores();if(usedCount>=36)finish();else{updateTurnBanner();show('boardScreen')}}
function updateScores(){s1.textContent=team1+' '+score1;s2.textContent=team2+' '+score2}
function finish(){const w=score1===score2?'تعادل':score1>score2?team1:team2;winnerName.textContent=w;finalScores.innerHTML='<b>'+team1+': '+score1+'</b><br><br><b>'+team2+': '+score2+'</b>';show('result')}
</script></body></html>
