<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>المجلس — BUILD 108</title>
</head>
<body>
<script>
/*
  Almajlis BUILD 108 bootstrap index
  Preserves the exact current index.html from the pinned BUILD 107 repository state,
  then swaps only the final build script reference to build108.js.
*/
(function () {
  'use strict';
  var pinned = 'bc29ad29b811f661e44f4ee764c9af43483a297d';
  var url = 'https://raw.githubusercontent.com/48f649tgsm-cyber/almajlis-game/' + pinned + '/index.html';

  fetch(url, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      html = html.replace(
        /<script\s+src=["']build107\.js(?:\?[^"']*)?["']\s*><\/script>/i,
        '<script src="build108.js?v=1"><\/script>'
      );

      if (!/build108\.js/i.test(html)) {
        html = html.replace(/<\/body>/i, '<script src="build108.js?v=1"><\/script>\n</body>');
      }

      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (err) {
      document.body.innerHTML = '<main dir="rtl" style="font-family:system-ui;padding:28px;text-align:center">' +
        '<h2>تعذر تحميل ملفات اللعبة</h2><p>تحقق من الاتصال ثم أعد فتح الصفحة.</p>' +
        '<small style="opacity:.6">BUILD 108</small></main>';
      console.error('Almajlis BUILD 108 bootstrap:', err);
    });
})();
</script>
</body>
</html>
